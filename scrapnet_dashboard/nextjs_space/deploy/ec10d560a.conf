server {
    listen 80;
    server_name ec10d560a.vm.internal;
    add_header Cache-Control "max-age=0, s-maxage=60";
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_x_original_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Custom domain vhost — serves once bedrockesg.com Destination is set to
# "Your SuperComputer" in Manage Domains (Host arrives as the domain itself).
server {
    listen 80;
    server_name bedrockesg.com www.bedrockesg.com;
    add_header Cache-Control "max-age=0, s-maxage=60";
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# FAD sub-portal — serves once fad.bedrockesg.com is bound as a Custom Domain
# (Destination "Your SuperComputer") in Manage Domains. Root lands on /bedrockfad,
# mirroring bedrockfad.com. Origin readiness so no 1034 once the edge routes it.
server {
    listen 80;
    server_name fad.bedrockesg.com;
    add_header Cache-Control "max-age=0, s-maxage=60";
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    location = / {
        # Edge terminates TLS and forwards plain HTTP; honour the public scheme
        # (X-Forwarded-Proto) so the redirect never downgrades to http (mixed content).
        return 301 https://$host/bedrockfad;
    }

    # The portal route is /bedrockfad; /fad is a friendly alias the operator uses.
    location = /fad {
        return 301 https://$host/bedrockfad;
    }
    location = /fad/ {
        return 301 https://$host/bedrockfad;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}



# FAD sub-portal on the bedrockfad.com zone — serves once fad.bedrockfad.com is
# bound as a Custom Domain (target = this SuperComputer). Root lands on /bedrockfad,
# mirroring bedrockfad.com. Origin readiness so no 1034 once the edge routes it.
server {
    listen 80;
    server_name fad.bedrockfad.com;
    add_header Cache-Control "max-age=0, s-maxage=60";
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.abacus.ai";

    location = / {
        # Edge terminates TLS and forwards plain HTTP; force https so the redirect
        # never downgrades to http (mixed content) on the HTTPS page.
        return 301 https://$host/bedrockfad;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}